publishers:
  heading: For publishers
  lede: From personal websites to CMS platforms
  description: |
    Use the AboutSpec API to make your about page content available in more places:

    - Create a file called `about.md`
    - Add your profile in [Markdown](https://daringfireball.net/projects/markdown/) format
    - Include as many links and images as you like!
    - Publish it at `/.well-known/about.md`
    - Allow [CORS](https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CORS) requests

    That's it. That's all publishers need to implement.
  cta:
    label: Join the RFC →
    href: https://github.com/socialspec/aboutspec.org/issues/1

subscribers:
  heading: For subscribers
  lede: From RSS feed readers to next-gen social experiences
  description: |
    Use the AboutSpec API to present richer profile pages.

    - Discovery is a single `HTTP GET` request
    - Parse responses using standard Markdown libraries
    - Display content in "About" tabs

    That's it. That's all subscribers need to implement.
  cta:
    label: Join the RFC →
    href: https://github.com/socialspec/aboutspec.org/issues/1
  http:
    request:
      label: Request
      badge: Discovery
      method: GET
      url: https://jordandoe.com/.well-known/about.md
      headers:
        - name: Host
          value: jordandoe.com
        - name: Accept
          value: text/markdown
        - name: If-None-Match
          value: '"5eb63bbbe01eeed093cb22bb8f5acdc3"'
    response:
